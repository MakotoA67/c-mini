<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組み込みCミニ演習室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>組み込みCミニ演習室</h1>

	<p class="intro">
	    Zenn「組み込みC講座」の内容を確認するためのミニ演習です。
	</p>

	<p class="article-link">
	    <a href="https://zenn.dev/makoto_a67/articles/2928e9cf77df9f" target="_blank" rel="noopener">
	        関連記事：組み込みC講座 第19講「C言語の整数型を整理する」
	    </a>
	</p>

        <section class="quiz-card">
            <div id="question-number"></div>

            <h2 id="question"></h2>

            <pre id="code-block" class="code-block"></pre>

            <div id="choices" class="choices"></div>

            <div id="result" class="result"></div>

            <div id="explanation" class="explanation"></div>

            <div id="score" class="score"></div>

            <button id="next-button" class="next-button" disabled>
                次の問題
            </button>
        </section>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>

</body>
</html>
